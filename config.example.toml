# prompt-guard example config.
#
# Copy to ~/.config/prompt-guard/config.toml and edit.
# Every key is optional; the values shown here are the defaults,
# except the examples under [rules] words / patterns.
# Another location can be set with the PROMPT_GUARD_CONFIG environment variable.

[layers]
rules = true        # layer 1: regex + entropy (fast, no model)
ner = false         # layer 2: GLiNER-PII for names, addresses, organizations
llm = false         # layer 3: local LLM review (LM Studio, Ollama, ...)

[rules]
entropy = true              # flag long random-looking strings as SECRET
entropy_threshold = 4.0     # bits per character; higher = fewer false positives
entropy_min_length = 20     # shorter strings are never checked for entropy

# Your own words to hide: project names, internal hosts, company names.
# Matched as whole words, case-insensitive. Placeholder kind: CUSTOM.
words = ["example-project", "intranet.example.internal"]

# Values that must never be redacted (exact match, case-insensitive).
allowlist = ["127.0.0.1", "0.0.0.0", "255.255.255.255", "localhost"]

# Your own regex patterns. name becomes the placeholder kind, e.g. [[TICKET_1]].
# User patterns win over built-in rules when they match the same text.
[[rules.patterns]]
name = "TICKET"
regex = '\bEXAMPLE-\d{4}\b'

[vault]
dir = "~/.local/state/prompt-guard"   # session mapping files, created with mode 0700/0600
ttl_hours = 24.0    # sessions not used for this long are deleted; 0 = keep until "clear"

[ner]
# Layer 2 needs the optional extra: pip install -e ".[ner]" (see docs/runbook.md).
# Any GLiNER model from Hugging Face works, for example:
#   knowledgator/gliner-pii-base-v1.0   (default, Apache-2.0)
#   knowledgator/gliner-pii-edge-v1.0   (faster, less accurate)
#   nvidia/gliner-PII                   (larger, slower on CPU)
model = "knowledgator/gliner-pii-base-v1.0"
threshold = 0.3      # lower finds more (and more false positives), higher is stricter
# Labels are free text (zero-shot). Each becomes a placeholder kind:
# name -> PERSON, location address/street -> ADDRESS, organization -> ORG, username -> USERNAME.
labels = ["name", "location address", "location street", "organization", "username"]
device = "cpu"       # "cuda" only with a CUDA build of torch and a visible GPU
max_chunk_words = 200
offline_after_download = true   # after the first download, never contact Hugging Face

[llm]
# Any OpenAI-compatible server.
# LM Studio on this machine:        http://localhost:1234/v1
# LM Studio on another LAN host:    http://<host-ip>:1234/v1  ("Serve on Local Network" on)
# Ollama:                           http://localhost:11434/v1
base_url = "http://localhost:1234/v1"
model = "qwen3-8b"
api_key = "lm-studio"   # LM Studio and Ollama ignore it, but the client needs a value
timeout = 120.0         # seconds

[clipboard]
# auto picks: WSL -> Windows clipboard, Wayland -> wl-clipboard, X11 -> xclip/xsel, macOS -> pbcopy.
# Set one of "wayland", "x11", "wsl", "macos" to force it.
backend = "auto"
timeout = 10.0   # seconds
