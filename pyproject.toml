[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-guard"
version = "1.0.0"
description = "Local, reversible redaction of secrets and personal data before pasting into online AI chats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prompt-guard = "prompt_guard.cli:main"
pgd = "prompt_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Layer 2. Install a CPU build of torch first, see docs/runbook.md.
ner = ["gliner>=0.2.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
